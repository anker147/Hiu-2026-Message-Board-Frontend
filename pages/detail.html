<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>留言详情与评论 · 留言板</title>
  <link rel="stylesheet" href="../css/tokens.css?v=20261124a">
  <link rel="stylesheet" href="../css/base.css?v=20261124a">
  <link rel="stylesheet" href="../css/components.css?v=20261124a">
  <link rel="stylesheet" href="../css/pages.css?v=20261124a">
</head>
<body data-page="detail">
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar"></header>

  <main class="detail-wrap container">
    <h1 class="detail-title" data-text="detail.title">留言详情与评论</h1>

    <section id="msgArea" aria-live="polite"></section>

    <h2 class="comment-section-title">
      <span data-text="detail.commentTitle">评论</span>
      <span id="commentCount" style="color:var(--blue)"></span>
      <span style="font-size:12px;color:var(--ink-3);font-weight:400;margin-left:8px" data-text="detail.commentTreeNote">二级树状</span>
    </h2>

    <section id="commentList" aria-live="polite" style="margin-top:6px"></section>

    <!-- 评论输入条 -->
    <div class="comment-input-bar" id="commentBar">
      <textarea id="commentInput" rows="1"
                data-text-placeholder="detail.commentPlaceholder"
                placeholder="写下你的评论" aria-label="写评论"></textarea>
      <button class="btn btn--primary" id="commentSubmitBtn" data-text="detail.commentSubmit">发送评论</button>
    </div>
    <div class="hint-bar hint-bar--danger hint-bar--hidden" id="commentErrBar" role="alert" style="margin-top:12px"></div>
  </main>

  <script src="../js/ui-text.js?v=20261124a"></script>
  <script src="../js/mock/seed.js?v=20261124a"></script>
  <script src="../js/mock/db.js?v=20261124a"></script>
  <script src="../js/mock/api.js?v=20261124a"></script>
  <script src="../js/core/util.js?v=20261124a"></script>
  <script src="../js/components.js?v=20261124a"></script>
  <script src="../js/pages/detail.js?v=20261124a"></script>
</body>
</html>
