<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>登录 · 留言板</title>
  <link rel="stylesheet" href="../css/tokens.css?v=20261124e">
  <link rel="stylesheet" href="../css/base.css?v=20261124e">
  <link rel="stylesheet" href="../css/components.css?v=20261124e">
  <link rel="stylesheet" href="../css/pages.css?v=20261124e">
</head>
<body data-page="login">
  <div class="grain" aria-hidden="true"></div>
  <!-- 背景：公开图站随机自然景观（JS 随机取图，15% 不透明度，离线时静默隐藏） -->
  <img class="login-bg" id="loginBg" alt="" aria-hidden="true">
  <div class="login-veil" aria-hidden="true"></div>

  <!-- 左右分栏：左侧文字宣传区 + 右侧深色玻璃登录窗（参照赛事裁判管理系统登录页形制） -->
  <main class="login-shell">
    <div class="login-panel">

      <!-- 左侧：品牌文字区 -->
      <section class="login-intro">
        <div class="login-intro-glow" aria-hidden="true"></div>
        <div class="login-intro-content">
          <div class="logo-area">
            <span class="login-logo-badge" aria-hidden="true">B</span>
            <span class="logo-text">
              <span class="logo-main">留言板</span>
              <span class="logo-sub" data-text="login.kicker">MESSAGE BOARD · HIU 2026</span>
            </span>
          </div>

          <h1 class="login-big">留言板</h1>
          <div class="login-bar" aria-hidden="true"></div>
          <p class="login-slogan-line" data-text="login.subtitle">登录后即可留言 评论 点赞 抽盲盒</p>

          <div class="login-feature-list">
            <div class="login-feature">
              <span class="login-feature-icon" aria-hidden="true">🔥</span>
              <span class="login-feature-text">
                <span class="login-feature-name" data-text="login.featureHot">热度周榜</span>
                <span class="login-feature-desc" data-text="login.featureHotDesc">全站留言折合分排行，看看大家都在聊什么</span>
              </span>
            </div>
            <div class="login-feature">
              <span class="login-feature-icon" aria-hidden="true">🎁</span>
              <span class="login-feature-text">
                <span class="login-feature-name" data-text="login.featureBlind">盲盒祝福</span>
                <span class="login-feature-desc" data-text="login.featureBlindDesc">抽一条陌生人的留言，匿名送出你的祝福</span>
              </span>
            </div>
            <div class="login-feature">
              <span class="login-feature-icon" aria-hidden="true">🔒</span>
              <span class="login-feature-text">
                <span class="login-feature-name" data-text="login.featurePrivacy">隐私脱敏</span>
                <span class="login-feature-desc" data-text="login.featurePrivacyDesc">真实信息自己掌控，对外只展示掩码</span>
              </span>
            </div>
          </div>
        </div>
        <span class="login-intro-foot" data-text="login.footer">© 2026 留言板 · Hiu 2026</span>
      </section>

      <!-- 右侧：登录窗口 -->
      <section class="login-window" aria-label="登录与注册">
        <div class="login-window-inner">
          <h2 class="lw-title" data-text="login.windowTitle">欢迎回来</h2>
          <p class="lw-sub" id="lwSub" data-text="login.windowSub">登录你的留言板账号</p>

          <div class="login-tabs" role="tablist" aria-label="登录或注册">
            <button type="button" class="login-tab is-on" data-form="login" role="tab"
                    aria-selected="true" data-text="login.tabLogin">账号登录</button>
            <button type="button" class="login-tab" data-form="register" role="tab"
                    aria-selected="false" data-text="login.tabReg">注册账号</button>
          </div>

          <div class="login-forms">
            <!-- 登录表单 -->
            <section class="login-form" id="loginForm">
              <div class="lw-group">
                <label class="lw-label" for="loginPhone">
                  <svg class="lw-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <span data-text="login.accountLabel">账号 / 手机号</span>
                </label>
                <input type="tel" class="field-input lw-input" id="loginPhone" maxlength="11"
                       data-text-placeholder="login.phonePlaceholder"
                       placeholder="请输入注册手机号" autocomplete="tel">
                <div class="field-error" id="loginPhoneErr" role="alert"></div>
              </div>

              <div class="lw-group">
                <label class="lw-label" for="loginPwd">
                  <svg class="lw-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <span data-text="login.passwordLabel">密码</span>
                </label>
                <input type="password" class="field-input lw-input" id="loginPwd"
                       data-text-placeholder="login.pwdPlaceholder"
                       placeholder="请输入密码" autocomplete="current-password">
                <button type="button" class="login-eye" id="loginEye" aria-label="显示或隐藏密码"></button>
                <div class="field-error" id="loginPwdErr" role="alert"></div>
              </div>

              <div class="hint-bar hint-bar--danger hint-bar--hidden" id="loginErrBar" role="alert"></div>

              <button class="login-submit" id="loginSubmitBtn" data-scramble data-text="login.submit">登 录</button>
              <a class="login-skip" href="index.html" data-text="login.skip">暂不登录</a>
            </section>

            <!-- 注册表单 -->
            <section class="login-form" id="regForm" hidden>
              <div class="lw-group">
                <label class="lw-label" for="regPhone"><span data-text="register.accountLabel">手机号</span></label>
                <input type="tel" class="field-input lw-input" id="regPhone" maxlength="11"
                       data-text-placeholder="register.phonePlaceholder"
                       placeholder="请输入 11 位大陆手机号" autocomplete="tel">
                <div class="field-error" id="regPhoneErr" role="alert"></div>
              </div>

              <div class="lw-group">
                <label class="lw-label" for="regPwd"><span data-text="register.passwordLabel">密码</span></label>
                <input type="password" class="field-input lw-input" id="regPwd"
                       data-text-placeholder="register.pwdPlaceholder"
                       placeholder="至少 8 位，含字母与数字" autocomplete="new-password">
                <div class="field-error" id="regPwdErr" role="alert"></div>
              </div>

              <div class="lw-group">
                <label class="lw-label" for="regConfirm"><span data-text="register.confirmLabel">确认密码</span></label>
                <input type="password" class="field-input lw-input" id="regConfirm"
                       data-text-placeholder="register.confirmPlaceholder"
                       placeholder="再次输入密码" autocomplete="new-password">
                <div class="field-error" id="regConfirmErr" role="alert"></div>
              </div>

              <div class="login-two">
                <input type="text" class="field-input lw-input" id="regName"
                       data-text-placeholder="register.namePlaceholder"
                       placeholder="真实姓名（选填）" autocomplete="name">
                <input type="email" class="field-input lw-input" id="regEmail"
                       data-text-placeholder="register.emailPlaceholder"
                       placeholder="邮箱地址（选填）" autocomplete="email">
              </div>

              <div class="hint-bar hint-bar--info" data-text="register.hint">注册后分配 8 位展示 ID 与 emoji 头像</div>
              <div class="hint-bar hint-bar--danger hint-bar--hidden" id="regErrBar" role="alert"></div>

              <button class="login-submit" id="regSubmitBtn" data-text="register.submit">注册并进入留言板</button>
            </section>
          </div>

          <!-- 用户协议：勾选后才允许提交（登录 / 注册共用） -->
          <label class="login-agree">
            <input type="checkbox" id="loginAgree">
            <span data-text="login.agree">我已阅读并同意</span><a href="#" id="agreeLink" data-text="login.agreeDoc">《用户协议》</a>
          </label>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/ui-text.js?v=20261124e"></script>
  <script src="../js/mock/seed.js?v=20261124e"></script>
  <script src="../js/mock/db.js?v=20261124e"></script>
  <script src="../js/mock/api.js?v=20261124e"></script>
  <script src="../js/core/util.js?v=20261124e"></script>
  <script src="../js/components.js?v=20261124e"></script>
  <script src="../js/pages/auth.js?v=20261124e"></script>
</body>
</html>
