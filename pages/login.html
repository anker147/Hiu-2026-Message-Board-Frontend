<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#10141d">
  <title data-text="login.title">登录 · 留言板</title>
  <link rel="stylesheet" href="../css/tokens.css?v=20261124ao">
  <link rel="stylesheet" href="../css/base.css?v=20261124ao">
  <link rel="stylesheet" href="../css/components.css?v=20261124ao">
  <link rel="stylesheet" href="../css/pages.css?v=20261124ao">
</head>
<body data-page="login">
  <!-- 全屏沉浸背景：公开图站随机景观（JS 预载，离线静默隐藏）+ 遮罩 -->
  <img class="login-kv" id="loginBg" alt="" aria-hidden="true">
  <div class="login-kv-tint" aria-hidden="true"></div>

  <main class="login-page">
    <!-- 左侧：品牌核心展示（悬浮于沉浸背景） -->
    <section class="login-brand">
      <header class="brand-head">
        <span class="brand-name" data-text="login.brandName">Board</span>
      </header>
      <div class="brand-core">
        <h1 class="brand-hero" data-text="login.heroTitle">把想说的话，留在榜上</h1>
        <p class="brand-hero-desc" data-text="login.heroDesc">热度周榜、盲盒祝福、隐私脱敏——一站式记录你的每一次表达。</p>
        <ul class="brand-highlights">
          <li class="brand-chip"><span class="chip-ico" aria-hidden="true">✓</span><span data-text="login.featureHotDesc">全站留言折合分排行，看看大家都在聊什么</span></li>
          <li class="brand-chip"><span class="chip-ico" aria-hidden="true">✓</span><span data-text="login.featureBlindDesc">抽一条陌生人的留言，匿名送出你的祝福</span></li>
          <li class="brand-chip"><span class="chip-ico" aria-hidden="true">✓</span><span data-text="login.featurePrivacyDesc">真实信息自己掌控，对外只展示掩码</span></li>
        </ul>
      </div>
      <footer class="brand-foot" data-text="login.footer">© 2026 留言板 · Hiu 2026</footer>
    </section>

    <!-- 右侧：深灰亚克力登录卡 -->
    <section class="login-panel">
      <div class="login-card">
        <div class="brand-compact" aria-hidden="true">
          <span class="brand-compact-name" data-text="login.brandName">Board</span>
        </div>
        <h2 class="login-card-title" id="lwSub" data-text="login.windowTitle">欢迎回来</h2>
        <p class="login-subline" data-text="login.windowSub">登录你的留言板账号</p>

        <div class="login-tabs" data-active="login" role="tablist" aria-label="登录或注册">
          <button type="button" class="login-tab is-on" data-form="login" role="tab"
                  aria-selected="true" data-text="login.tabLogin">账号登录</button>
          <button type="button" class="login-tab" data-form="register" role="tab"
                  aria-selected="false" data-text="login.tabReg">注册账号</button>
        </div>

        <div class="login-forms">
          <!-- 登录表单 -->
          <section class="login-form is-active" id="loginForm">
            <label class="login-field">
              <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="input lw-input" id="loginPhone" type="tel" maxlength="11"
                     placeholder=" " autocomplete="username" spellcheck="false">
              <span class="float-label"><span data-text="login.accountLabel">账号 / 手机号</span></span>
            </label>
            <div class="field-error" id="loginPhoneErr" role="alert"></div>

            <label class="login-field">
              <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="input lw-input" id="loginPwd" type="password"
                     placeholder=" " autocomplete="current-password">
              <span class="float-label"><span data-text="login.passwordLabel">密码</span></span>
              <button type="button" class="login-eye" id="loginEye" aria-label="显示或隐藏密码"></button>
            </label>
            <div class="field-error" id="loginPwdErr" role="alert"></div>

            <label class="login-option">
              <input type="checkbox" id="rememberMe">
              <span data-text="login.remember">记住账号</span>
            </label>

            <div class="hint-bar hint-bar--danger hint-bar--hidden" id="loginErrBar" role="alert"></div>
            <button class="login-submit" id="loginSubmitBtn" data-scramble data-text="login.submit">登 录</button>
            <a class="login-skip" href="index.html" data-text="login.skip">暂不登录</a>
          </section>

          <!-- 注册表单 -->
          <section class="login-form" id="regForm" hidden>
            <label class="login-field">
              <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="input lw-input" id="regPhone" type="tel" maxlength="11"
                     placeholder=" " autocomplete="username">
              <span class="float-label"><span data-text="register.accountLabel">手机号</span><b class="req-star" aria-hidden="true">*</b></span>
            </label>
            <div class="field-error" id="regPhoneErr" role="alert"></div>

            <label class="login-field">
              <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="input lw-input" id="regPwd" type="password"
                     placeholder=" " autocomplete="new-password">
              <span class="float-label"><span data-text="register.passwordLabel">密码</span><b class="req-star" aria-hidden="true">*</b></span>
            </label>
            <div class="field-error" id="regPwdErr" role="alert"></div>

            <label class="login-field">
              <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              <input class="input lw-input" id="regConfirm" type="password"
                     placeholder=" " autocomplete="new-password">
              <span class="float-label"><span data-text="register.confirmLabel">确认密码</span><b class="req-star" aria-hidden="true">*</b></span>
            </label>
            <div class="field-error" id="regConfirmErr" role="alert"></div>

            <label class="login-field">
              <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              <input class="input lw-input" id="regName" type="text"
                     placeholder=" " autocomplete="name">
              <span class="float-label"><span data-text="register.nameLabel">真实姓名</span><em class="opt-tag" data-text="register.optionalTag">选填</em></span>
            </label>
            <label class="login-field">
              <svg class="field-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
              <input class="input lw-input" id="regEmail" type="email"
                     placeholder=" " autocomplete="email">
              <span class="float-label"><span data-text="register.emailLabel">邮箱地址</span><em class="opt-tag" data-text="register.optionalTag">选填</em></span>
            </label>

            <div class="hint-bar hint-bar--info" data-text="register.hint">注册后分配 8 位展示 ID 与 emoji 头像</div>
            <div class="hint-bar hint-bar--danger hint-bar--hidden" id="regErrBar" role="alert"></div>
            <button class="login-submit" id="regSubmitBtn" data-text="register.submit">注册并进入留言板</button>
          </section>
        </div>

        <label class="login-agree">
          <input type="checkbox" id="loginAgree">
          <span data-text="login.agree">我已阅读并同意</span><a href="#" id="agreeLink" data-text="login.agreeDoc">《用户协议》</a>
        </label>
      </div>
    </section>
  </main>

  <script src="../js/ui-text.js?v=20261124ao"></script>
  <script src="../js/mock/seed.js?v=20261124ao"></script>
  <script src="../js/mock/db.js?v=20261124ao"></script>
  <script src="../js/mock/api.js?v=20261124ao"></script>
  <script src="../js/core/util.js?v=20261124ao"></script>
  <script src="../js/core/media.js?v=20261124ao"></script>
  <script src="../js/components.js?v=20261124ao"></script>
  <script src="../js/pages/auth.js?v=20261124ao"></script>
</body>
</html>
