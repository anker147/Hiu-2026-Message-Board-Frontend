<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <meta name="description" content="帖子编辑器 — 新建与编辑统一入口（参照好游快爆 sendThreadShow 形制）">
  <title>帖子编辑器 · 留言板</title>
  <link rel="stylesheet" href="../css/tokens.css?v=20261124aj">
  <link rel="stylesheet" href="../css/base.css?v=20261124aj">
  <link rel="stylesheet" href="../css/components.css?v=20261124aj">
  <link rel="stylesheet" href="../css/pages.css?v=20261124aj">
</head>
<body data-page="edit">
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar"></header>

  <main class="editor-page">
    <!-- 编辑器顶部操作行（sendThreadShow：类型下拉「文章▾」+ 版块选择 + 右侧状态） -->
    <section class="editor-topbar" id="editorTopbar" hidden>
      <div class="editor-topbar-left">
        <div class="dropdown editor-select" id="typeDropdown" aria-label="帖子类型"></div>
        <div class="dropdown editor-select" id="topicDropdown" aria-label="话题版块"></div>
        <span class="editor-mode-chip" id="modeChip"></span>
      </div>
      <div class="editor-topbar-right">
        <span class="editor-topbar-note" data-text="post.contentMax">最多 500 字</span>
      </div>
    </section>

    <!-- 排版工具栏（Word 式）：字体 / 字号 / 标题 / 序号 / 缩进 / 对齐 + 原有表情与禁用态 -->
    <section class="editor-toolbar-bar" id="toolbarBar" hidden>
      <div class="rich-tools" id="richTools" role="toolbar" aria-label="正文排版">
        <select class="rt-select rt-font" id="rtFont" data-text-title="edit.rich.font" aria-label="字体">
          <option value="" data-text="edit.rich.fontDefault">默认字体</option>
          <option value="'Microsoft YaHei','PingFang SC',sans-serif" data-text="edit.rich.fontSans">黑体</option>
          <option value="SimSun,'Songti SC',serif" data-text="edit.rich.fontSerif">宋体</option>
          <option value="'KaiTi','STKaiti',serif" data-text="edit.rich.fontKai">楷体</option>
          <option value="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">思源黑体</option>
          <option value="'LXGW WenKai','KaiTi',serif">霞鹜文楷</option>
          <option value="fusion-pixel,monospace" data-text="edit.rich.fontPixel">像素字体</option>
        </select>
        <select class="rt-select rt-size" id="rtSize" data-text-title="edit.rich.size" aria-label="字号">
          <option value="14px">14</option>
          <option value="16px" selected>16</option>
          <option value="18px">18</option>
          <option value="24px">24</option>
          <option value="32px">32</option>
          <option value="48px">48</option>
        </select>
        <span class="rt-sep" aria-hidden="true"></span>
        <select class="rt-select rt-title" id="rtTitle" data-text-title="edit.rich.title" aria-label="标题层级">
          <option value="p" data-text="edit.rich.body">正文</option>
          <option value="h2">标题 1</option>
          <option value="h3">标题 2</option>
        </select>
        <button type="button" class="rt-btn rt-btn--text" data-cmd="bold" data-text-title="edit.rich.bold" aria-label="加粗"><b>B</b></button>
        <button type="button" class="rt-btn rt-btn--text" data-cmd="italic" data-text-title="edit.rich.italic" aria-label="斜体"><i>I</i></button>
        <button type="button" class="rt-btn rt-btn--text" data-cmd="underline" data-text-title="edit.rich.underline" aria-label="下划线"><u>U</u></button>
        <span class="rt-sep" aria-hidden="true"></span>
        <button type="button" class="rt-btn" data-cmd="insertOrderedList" data-text-title="edit.rich.olist" aria-label="编号">1.</button>
        <button type="button" class="rt-btn" data-cmd="insertUnorderedList" data-text-title="edit.rich.ulist" aria-label="项目符号">•</button>
        <button type="button" class="rt-btn" id="rtIndent" data-text-title="edit.rich.indent" aria-label="首行缩进">↦</button>
        <span class="rt-sep" aria-hidden="true"></span>
        <button type="button" class="rt-btn" data-cmd="justifyLeft" data-text-title="edit.rich.alignLeft" aria-label="左对齐">左</button>
        <button type="button" class="rt-btn" data-cmd="justifyCenter" data-text-title="edit.rich.alignCenter" aria-label="居中对齐">中</button>
        <button type="button" class="rt-btn" data-cmd="justifyRight" data-text-title="edit.rich.alignRight" aria-label="右对齐">右</button>
      </div>
      <div class="address-tools">
        <button type="button" class="tb-btn" id="emojiBtn" aria-haspopup="true" aria-label="表情">😊</button>
        <button type="button" class="tb-btn is-disabled" id="tbImage" data-text-title="editPage.disabledImageTip" aria-label="图片"></button>
        <button type="button" class="tb-btn is-disabled" id="tbVideo" data-text-title="editPage.disabledVideoTip" aria-label="视频"></button>
        <button type="button" class="tb-btn is-disabled" id="tbPoll" data-text-title="editPage.disabledPollTip" aria-label="投票"></button>
        <button type="button" class="tb-btn is-disabled" id="tbAt" data-text-title="editPage.disabledAtTip" aria-label="@"></button>
        <button type="button" class="tb-btn is-disabled" id="tbQuote" data-text-title="editPage.disabledQuoteTip" aria-label="引用"></button>
      </div>
      <div class="emoji-pop" id="emojiPop" role="menu" aria-label="插入表情"></div>
    </section>

    <!-- 加载骨架 / 页面级状态盒（未登录 / 不存在 / 非本人）由 edit.js 渲染至此 -->
    <section id="editArea"></section>

    <!-- 编辑器画布（sendThreadShow 居中窄卡形制） -->
    <div class="editor-canvas" id="editorCanvas" hidden>
      <!-- 原帖信息条（仅编辑模式） -->
      <div class="edit-origin-card" id="editOrigin"></div>

      <!-- 正文卡：标题（选填）+ 分隔线 + 内容 -->
      <section class="editor-card">
        <div class="editor-title-wrap">
          <input type="text" id="editTitle" class="editor-title-input" maxlength="48"
                 data-text-placeholder="editPage.titlePlaceholder" aria-label="标题（选填）">
          <span class="editor-title-max" aria-hidden="true">48</span>
        </div>
        <div class="editor-divider" aria-hidden="true"></div>
        <div id="editContent" class="editor-content-input editor-rich-input" contenteditable="true"
             role="textbox" aria-multiline="true" spellcheck="false"
             data-text-placeholder="editPage.contentPlaceholder" data-placeholder="请输入内容"
             aria-label="正文"></div>
      </section>

      <!-- 设置封面（原型禁用形制：无后端图片存储） -->
      <section class="editor-cover-card" id="coverCard">
        <button type="button" class="editor-cover-btn" id="coverBtn" data-text-title="editPage.disabledCoverTip" aria-label="设置封面"></button>
        <div class="editor-cover-note">
          <div class="t" data-text="editPage.coverLabel">设置封面</div>
          <div data-text="editPage.coverNote1">· 前端原型不包含图片上传（无后端存储）</div>
          <div data-text="editPage.coverNote2">· 图片能力接入后支持 JPEG / JPG / PNG</div>
        </div>
      </section>

      <!-- 设置卡：公开范围 + 本次昵称（新建）/ 危险区（编辑）；可折叠 -->
      <section class="editor-settings-card">
        <div class="es-head">
          <span class="es-title" data-text="editPage.settingsLabel">设置</span>
          <button type="button" class="es-toggle" id="settingsToggle">
            <span class="es-caret" aria-hidden="true">▼</span>
            <span data-text="editPage.publishSettings">发布设置</span>
          </button>
        </div>
        <div class="es-body" id="settingsBody">
          <div id="newOnlyBlock">
            <div class="privacy-row es-privacy-row">
              <label class="privacy-item"><span class="switch switch--sm"><input type="checkbox" id="pflagName"><span class="switch-track"></span></span><span data-text="post.privacyName">公开姓名</span></label>
              <label class="privacy-item"><span class="switch switch--sm"><input type="checkbox" id="pflagEmail"><span class="switch-track"></span></span><span data-text="post.privacyEmail">公开邮箱</span></label>
              <label class="privacy-item"><span class="switch switch--sm"><input type="checkbox" id="pflagPhone"><span class="switch-track"></span></span><span data-text="post.privacyPhone">公开手机号</span></label>
            </div>
            <div class="field es-nick-field">
              <label class="field-label" for="postNickname" data-text="post.nicknameLabel">本次显示昵称</label>
              <input type="text" class="field-input" id="postNickname" maxlength="20" aria-label="本次显示昵称">
            </div>
          </div>
          <!-- 危险区（仅编辑模式）：删除走 P-08 确认弹窗 -->
          <div class="edit-danger" id="editDanger">
            <span class="edit-danger-label" data-text="editPage.dangerZone">危险操作</span>
            <span class="edit-danger-note" data-text="editPage.dangerNote">删除后不可恢复，评论与点赞一并清除</span>
            <button class="btn btn--danger btn--sm" id="deleteBtn" data-text="detail.delete">删除</button>
          </div>
        </div>
      </section>

      <p class="post-branch-note editor-branch-note">异常分支：401 引导登录 · 非本人 5002 状态盒 · 敏感词就地提示保留草稿 · 网络失败保留草稿可重试</p>
    </div>

    <!-- 最新发布（仅新建模式）：提交成功后新卡插入并 --blue 高亮 1800ms（F5 两阶段定位） -->
    <h2 class="comment-section-title" id="newListTitle" hidden>
      <span data-text="post.latestTitle">最新发布</span>
      <a href="index.html" style="font-size:12px;font-weight:400;margin-left:10px" data-text="post.backBoard">返回热度周榜 →</a>
    </h2>
    <section class="board-list stagger" id="newList" style="margin-top:12px" hidden></section>
  </main>

  <!-- 底部固定操作条（sendThreadShow：左正文字数 + 右发布按钮） -->
  <div class="editor-footer-bar" id="footerBar" hidden>
    <div class="editor-footer-inner">
      <span class="ef-count"><span data-text="editPage.wordCount">正文字数</span>：<b id="wordCount">0</b></span>
      <button class="btn btn--primary btn--lg" id="editSaveBtn">发布</button>
    </div>
  </div>

  <script src="../js/ui-text.js?v=20261124aj"></script>
  <script src="../js/mock/seed.js?v=20261124aj"></script>
  <script src="../js/mock/db.js?v=20261124aj"></script>
  <script src="../js/mock/api.js?v=20261124aj"></script>
  <script src="../js/core/util.js?v=20261124aj"></script>
  <script src="../js/components.js?v=20261124aj"></script>
  <script src="../js/pages/edit.js?v=20261124aj"></script>
</body>
</html>
