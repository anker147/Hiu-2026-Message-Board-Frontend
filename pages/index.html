<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <meta name="description" content="留言板热度周榜 — 把今天想说的话，留在榜上">
  <title>留言板热度周榜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css?v=20261124t">
  <link rel="stylesheet" href="../css/base.css?v=20261124t">
  <link rel="stylesheet" href="../css/components.css?v=20261124t">
  <link rel="stylesheet" href="../css/pages.css?v=20261124t">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar"></header>

  <main class="container" id="boardView">
    <!-- Banner（9.1：230px 圆角 16 渐变 + 大字 + 期号徽章 + 纯 SVG 手绘插画；标题随 tab 语义切换） -->
    <section class="banner" aria-label="留言板热度周榜横幅" data-text-aria="banner.ariaHot">
      <div class="banner-left">
        <h1 class="banner-title" data-text="banner.title">留言板热度周榜</h1>
        <p class="banner-sub" data-text="banner.subtitle">把今天想说的话，留在榜上</p>
        <div class="banner-issue">
          <span class="issue-badge" id="issueBadge">24</span>
          <span class="issue-text" id="issueText"></span>
        </div>
      </div>
      <div class="banner-art" aria-hidden="true">
        <svg viewBox="0 0 400 190" width="400" height="190">
          <rect x="52" y="34" width="88" height="66" rx="22" fill="rgba(255,255,255,0.34)"/>
          <polygon points="70,98 62,118 92,100" fill="rgba(255,255,255,0.34)"/>
          <rect x="150" y="26" width="184" height="132" rx="36" fill="#FFFFFF"/>
          <polygon points="226,156 214,182 258,156" fill="#FFFFFF"/>
          <circle cx="212" cy="82" r="7" fill="#359EFF"/>
          <circle cx="272" cy="82" r="7" fill="#359EFF"/>
          <ellipse cx="190" cy="104" rx="12" ry="7" fill="#FFD3E1"/>
          <ellipse cx="294" cy="104" rx="12" ry="7" fill="#FFD3E1"/>
          <path d="M218 106 Q242 126 266 106" stroke="#FB7299" stroke-width="6" fill="none" stroke-linecap="round"/>
          <polygon points="118,42 122,52 132,56 122,60 118,70 114,60 104,56 114,52" fill="#FFE3EE"/>
          <polygon points="352,26 355,34 363,37 355,40 352,48 349,40 341,37 349,34" fill="#FFFFFF"/>
          <polygon points="376,140 379,148 387,151 379,154 376,162 373,154 365,151 373,148" fill="#FFD9E6"/>
          <polygon points="140,150 142,156 148,158 142,160 140,166 138,160 132,158 138,156" fill="#FFFFFF"/>
        </svg>
      </div>
    </section>

    <!-- 搜索工具栏（搜索框 + 期次下拉；排名规则由榜单固定，不提供排序选择） -->
    <section class="toolbar" aria-label="搜索与筛选">
      <div class="search-box">
        <span class="search-icon" id="searchIcon"></span>
        <input type="search" class="search-input" id="searchInput"
               data-text-placeholder="common.searchPlaceholder"
               placeholder="搜索留言内容 / 作者 / 话题" aria-label="搜索留言">
      </div>
      <div class="dropdown" id="periodDropdown"></div>
      <a class="btn btn--soft toolbar-all" href="index.html?tab=all" data-goto-tab="all" data-text="common.allMessages">全部留言</a>
    </section>

    <div class="list-caption" id="listCaption" aria-live="polite"></div>

    <!-- 榜单卡片列表 -->
    <section class="board-list stagger" id="boardList" aria-label="留言榜单"></section>
  <!-- 悬浮操作组（属于榜单视图：关于视图激活时随 boardView 一并隐藏） -->
  <div class="float-actions">
    <button class="float-btn float-btn--blindbox" id="blindboxBtn" data-scramble type="button">
      <span id="blindboxIcon"></span><span data-text="board.blindboxFloat">抽取今日盲盒</span>
    </button>
    <button class="float-btn float-btn--publish" id="publishFloatBtn" data-scramble type="button">
      <span id="publishIcon"></span><span data-text="board.publishFloat">发布一条留言</span>
    </button>
  </div>
  </main>

  <!-- 关于视图：岛内“关于”项软切换的挂载点（js/pages/about.js 惰性构建） -->
  <div id="aboutView" hidden></div>

  <!-- 全部留言视图：岛内“全部留言”tag 软切换的挂载点（js/pages/all.js 惰性构建） -->
  <div id="allView" hidden></div>

  <!-- 管理视图：岛内“管理员”tag 软切换的挂载点（js/pages/gm.js 惰性构建，仅 admin 可见） -->
  <div id="gmView" hidden></div>

  <script src="../js/ui-text.js?v=20261124t"></script>
  <script src="../js/mock/seed.js?v=20261124t"></script>
  <script src="../js/mock/db.js?v=20261124t"></script>
  <script src="../js/mock/api.js?v=20261124t"></script>
  <script src="../js/core/util.js?v=20261124t"></script>
  <script src="../js/components.js?v=20261124t"></script>
  <script src="../js/pages/board.js?v=20261124t"></script>
  <script src="../js/pages/about.js?v=20261124t"></script>
  <script src="../js/pages/all.js?v=20261124t"></script>
  <script src="../js/pages/gm.js?v=20261124t"></script>
</body>
</html>
