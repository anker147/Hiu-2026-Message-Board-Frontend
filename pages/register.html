<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>注册账号 · 留言板</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="register">
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar"></header>

  <main class="auth-wrap">
    <h1 class="auth-title" data-text="register.title">注册账号</h1>
    <p class="auth-sub" data-text="register.subtitle">手机号作为账号，注册即建立可信身份</p>

    <div class="auth-card">
      <div class="field">
        <label class="field-label" for="regPhone" data-text="register.phoneLabel">手机号 账号</label>
        <input type="tel" class="field-input" id="regPhone" maxlength="11"
               data-text-placeholder="register.phonePlaceholder"
               placeholder="请输入 11 位大陆手机号" autocomplete="tel">
        <div class="field-error" id="regPhoneErr" role="alert"></div>
      </div>

      <div class="field">
        <label class="field-label" for="regPwd" data-text="register.pwdLabel">密码</label>
        <input type="password" class="field-input" id="regPwd"
               data-text-placeholder="register.pwdPlaceholder"
               placeholder="至少 8 位，含字母与数字" autocomplete="new-password">
        <div class="field-error" id="regPwdErr" role="alert"></div>
      </div>

      <div class="field">
        <label class="field-label" for="regConfirm" data-text="register.confirmLabel">确认密码</label>
        <input type="password" class="field-input" id="regConfirm"
               data-text-placeholder="register.confirmPlaceholder"
               placeholder="再次输入密码" autocomplete="new-password">
        <div class="field-error" id="regConfirmErr" role="alert"></div>
      </div>

      <div class="field">
        <span class="field-label" data-text="register.optionalLabel">真实姓名 / 邮箱（选填）</span>
        <div class="two-col">
          <input type="text" class="field-input" id="regName"
                 data-text-placeholder="register.namePlaceholder"
                 placeholder="真实姓名" autocomplete="name">
          <input type="email" class="field-input" id="regEmail"
                 data-text-placeholder="register.emailPlaceholder"
                 placeholder="邮箱地址" autocomplete="email">
        </div>
      </div>

      <div class="hint-bar hint-bar--info" data-text="register.hint">注册后分配 8 位展示 ID 与 emoji 头像</div>
      <div class="hint-bar hint-bar--danger hint-bar--hidden" id="regErrBar" role="alert"></div>

      <button class="btn btn--primary btn--lg" id="regSubmitBtn" data-text="register.submit">注册并进入留言板</button>
      <p class="auth-alt">
        <span data-text="register.toLogin">已有账号</span>
        <a href="login.html" data-text="register.loginLink">登录</a>
      </p>
    </div>
  </main>

  <script src="../js/ui-text.js"></script>
  <script src="../js/mock/seed.js"></script>
  <script src="../js/mock/db.js"></script>
  <script src="../js/mock/api.js"></script>
  <script src="../js/core/util.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/auth.js"></script>
</body>
</html>
